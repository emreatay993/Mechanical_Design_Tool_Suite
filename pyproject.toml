[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanical-design-tool-suite"
version = "0.1.0"
description = "Desktop suite for mechanical design calculation tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6", "numpy>=1.26,<2", "pyvista>=0.43", "pyvistaqt>=0.11", "openpyxl>=3.1"]

[project.optional-dependencies]
build = ["pyinstaller==6.20.0"]

[project.scripts]
mechanical-design-tool-suite = "mechanical_design_tool_suite.launcher:main"
bolt-calc-gui = "mechanical_design_tool_suite.gui:main"
tolerance-analysis-gui = "mechanical_design_tool_suite.tolerance_gui:main"
tolerance-analysis-vnext-gui = "mechanical_design_tool_suite.tolerance_vnext_gui:main"
cad-1d-tolerance-gui = "mechanical_design_tool_suite.cad_tolerance_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechanical_design_tool_suite = [
    "data/*.json",
    "qml/*.qml",
    "qml/assets/*.md",
    "qml/assets/icons/*.svg",
]
